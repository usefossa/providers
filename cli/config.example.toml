# explicit config: --config /path/provider.toml or FOSSA_CONFIG.
# config paths resolve beside this file. keep config, keys and journals outside git.
# commands plan by default; --execute authorizes uploads/signing/broadcast.
journal_dir = "transactions"

[operator]
keypair = "provider-keypair.json"
# payer = "payer-keypair.json"

# hosted rpc defaults on without an own rpc url; reads sign authentication.
# api and public protocol addresses are pinned locally, with no config fetch.
# optional overrides:
# [solana]
# rpc_url = "https://rpc.example.com"
# usdc_mint = "REPLACE_WITH_PAYMENT_MINT"
# [marketplace]
# program_id = "REPLACE_WITH_PROGRAM_PUBLIC_KEY"
# market = "REPLACE_WITH_MARKET_PUBLIC_KEY"
# [hosted]
# api_url = "https://api.fossa.ag"
# rpc = false

[provider]
# optional with keypair; required for key-free planning through own rpc.
# wallet = "REPLACE_WITH_PROVIDER_PUBLIC_KEY"
metadata_file = "provider.json"
# metadata_uri = "https://provider.example.com/immutable/provider.json"
# omit uri for immutable fossa hosting on --execute.
speed_tps = 100
capacity = 4
private = false
active = true
model_book_limit = 16
bond_target_atomic = "1000000"

[[provider.models]]
id = "example/model"
metadata_file = "model.json"
# metadata_uri = "https://provider.example.com/immutable/model.json"
# rates below: micro-usdc per million tokens; 1000000 means $1.00/million.
input_rate = 1000000
cached_rate = 500000
output_rate = 2000000
# optional per-model overrides: speed_tps, capacity, private, active,
# bond_target_atomic and slot. omitted fields inherit provider defaults.
