[package]
name = "fossa-sdk"
version = "0.5.0"
edition = "2024"
publish = false
description = "Typed Fossa protocol, metadata, RPC and transaction client"

[dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
ed25519-dalek = "2.2"
fossa-metadata = { path = "../../schema" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
solana-address = { version = "~2.6.1", features = ["curve25519", "serde"] }
solana-hash = { version = "4", features = ["serde"] }
solana-instruction = { version = "~3.4.0", features = ["serde"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signature = { version = "3.3", features = ["verify", "serde"] }
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["serde", "verify"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "net", "sync"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
tempfile = "3"
