[package]
name = "fossa-cli"
version = "0.3.2"
edition = "2024"
publish = false
description = "Noninteractive Fossa CLI"

[dependencies]
fossa-sdk = { path = "../sdk/rust" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"

[[bin]]
name = "fossa"
path = "src/main.rs"
